<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeadSignal · 주인공 윤곽 계산 검수</title>
<style>
body{margin:32px;background:#111c21;color:#e9e3d1;font:16px/1.6 system-ui,sans-serif;max-width:1100px}h1{font-size:26px}button{padding:12px 20px;background:#263840;color:inherit;border:1px solid #efa74b;cursor:pointer}button:disabled{opacity:.5;cursor:wait}nav{display:flex;gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{margin:24px 0;padding:12px;border:1px solid #405157}img{image-rendering:auto;background:#18272b;max-width:100%}#status{color:#efbd75}#player-alpha-geometry-proof{display:flex;gap:20px;flex-wrap:wrap}
</style>
<h1>주인공 원본 리그 · 윤곽 계산 검수</h1>
<p>원본 몸체 12포즈의 윤곽을 비교합니다. CPU 계산 비용은 전체 전투 프레임 비용과 별도로 기록합니다.</p>
<nav></nav>
<p id="status" role="status">명시적 메모리 QA 조건 확인 중</p>
<script type="module">
const q=new URLSearchParams(location.search),allowed=location.protocol==='http:'&&['localhost','127.0.0.1','[::1]','::1'].includes(location.hostname)&&location.port==='8851'&&q.has('qa')&&q.has('qa-memory')&&q.get('qa-player-alpha-geometry')==='1';
if(allowed){
 try{const m=await import('./qa-player-alpha-geometry.js');const installed=m.installPlayerAlphaGeometryQA({document,location,query:q,eventTarget:globalThis});document.getElementById('status').textContent=installed?'별도 메모리 QA 준비 완료':'별도 메모리 QA 준비 실패';}
 catch(error){document.getElementById('status').textContent='검수 도구 로드 실패: '+(error?.message??String(error));}
}else document.getElementById('status').textContent='8851 별도 메모리 QA와 명시적 윤곽 검사 옵션이 필요합니다.';
</script>
</html>
