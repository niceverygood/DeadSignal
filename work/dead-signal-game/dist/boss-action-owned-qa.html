<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeadSignal · 보스 동작 원본 검수</title>
<style>
body{margin:28px;background:#101d23;color:#ece5d3;font:16px/1.6 system-ui,sans-serif;max-width:1100px}h1{font-size:26px}nav{display:flex;flex-wrap:wrap;gap:12px}button,select{padding:10px 16px;background:#263840;color:inherit;border:1px solid #dba14e}button{cursor:pointer}button:disabled,select:disabled{opacity:.5}details{padding:12px;margin:20px 0;border:1px solid #43555d}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;height:auto}#status,[id$="-status"]{color:#efbd75}#boss-action-owned-proof{margin-top:22px}
</style>
<h1>보스 원본 리그 · 공격 동작 비교</h1>
<p>원본 메시와 관절로 공격 예고부터 공격까지 비교합니다. 이 화면은 품질 검수용이며 게임의 보스 동작을 자동 적용하지 않습니다.</p>
<nav></nav>
<p id="status" role="status">별도 메모리 QA 조건 확인 중</p>
<script type="module">
const query=new URLSearchParams(location.search),allowed=location.protocol==='http:'&&['localhost','127.0.0.1','[::1]','::1'].includes(location.hostname)&&location.port==='8851'&&query.has('qa')&&query.has('qa-memory')&&query.get('qa-boss-owned-cleanup')==='1';
if(allowed){try{const m=await import('./qa-boss-action-owned-ui.js');const installed=m.installBossActionOwnedQA({document,location,query,eventTarget:globalThis});document.getElementById('status').textContent=installed?'별도 메모리 검수 준비 완료':'별도 메모리 검수 준비 실패';}catch(error){document.getElementById('status').textContent='검수 도구 로드 실패: '+(error?.message??String(error));}}
else document.getElementById('status').textContent='8851 별도 메모리 QA와 명시적 보스 검수 옵션이 필요합니다.';
</script>
</html>
